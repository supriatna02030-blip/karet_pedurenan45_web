<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfamart Karet Pedurenan 45</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%) fixed;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:20px 20px;pointer-events:none;z-index:0}
.blob{position:fixed;width:280px;height:280px;background:#ED1C24;border-radius:50%;filter:blur(90px);opacity:.28;animation:float 6s ease-in-out infinite;pointer-events:none;z-index:0}
.card{background:#fff;border:1px solid #fff;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.06);backdrop-filter:blur(10px);transition:all .3s;animation:fadeInUp .6s ease-out both;cursor:pointer}
.card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 18px 45px rgba(0,0,0,.14)}
.card:active{transform:scale(.97)}
.btn{position:relative;overflow:hidden;transition:transform .15s}
.btn:active{transform:scale(.95)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s linear;pointer-events:none}
#ov{animation:fadeIn .3s}
.sheet{animation:slideUp .4s cubic-bezier(.16,1,.3,1)}
.bar{width:var(--w,0%);animation:fillBar 1.5s ease-out}
.fi{animation:fadeIn .5s}
.in{width:100%;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin-bottom:10px;outline:none;font-size:14px}
.in:focus{border-color:#ED1C24}
.lb{display:block;font-size:12px;font-weight:600;color:#475569;margin:4px 0}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fillBar{from{width:0}to{width:var(--w)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body class="text-slate-800">
<div class="blob" style="top:-90px;left:-90px"></div>
<div class="blob" style="bottom:-90px;right:-90px;animation-delay:-3s"></div>

<header class="relative z-10 bg-[#ED1C24] rounded-b-[32px] text-white px-5 pb-6 shadow-lg" style="padding-top:calc(env(safe-area-inset-top,0px) + 20px)">
  <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
    <div>
      <div class="inline-block bg-white text-[#ED1C24] font-extrabold text-lg px-3 py-0.5 rounded-lg italic">Alfamart</div>
      <h1 class="font-bold mt-2 leading-tight">KARET PEDURENAN 45</h1>
      <p id="clock" class="text-xs opacity-90 mt-1">--</p>
    </div>
    <div class="text-right flex items-center gap-3">
      <div><p class="text-[11px] opacity-80">PIC</p><p id="hn" class="text-sm font-semibold">Belum diisi</p></div>
      <div id="av" class="w-12 h-12 rounded-full bg-white/25 border-2 border-white overflow-hidden flex items-center justify-center text-xl bg-cover bg-center">👤</div>
    </div>
  </div>
</header>

<main class="relative z-10 max-w-xl mx-auto px-4 py-6">
  <div id="grid" class="grid grid-cols-2 gap-4"></div>
  <p class="text-center text-xs text-slate-400 mt-8">Data tersimpan di perangkat ini (localStorage)</p>
</main>

<div id="ov" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm items-end justify-center" onclick="if(event.target===this)closeM()">
  <div class="sheet bg-white w-full max-w-xl h-[92vh] rounded-t-[28px] overflow-y-auto p-5" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3"><div id="mi" class="w-11 h-11 rounded-2xl flex items-center justify-center text-xl"></div><h2 id="mt" class="font-bold text-lg"></h2></div>
      <button class="btn w-9 h-9 rounded-full bg-slate-100 font-bold" onclick="closeM()">✕</button>
    </div>
    <div id="mb"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id),S=localStorage;
const t=(id,l,ph='')=>`<label class="lb">${l}</label><input id="${id}" data-s class="in" placeholder="${ph}">`;
const n=(id,l,ev='')=>`<label class="lb">${l}</label><input id="${id}" data-s type="number" class="in" placeholder="0" ${ev}>`;
const a=(id,l)=>`<label class="lb">${l}</label><textarea id="${id}" data-s rows="2" class="in"></textarea>`;
const r=(id,l)=>`<label class="lb">${l}: <b id="${id}_v">0%</b></label><input id="${id}" data-s type="range" min="0" max="100" value="0" class="w-full accent-red-600" oninput="rg('${id}')"><div class="h-3 bg-slate-200 rounded-full overflow-hidden mb-3"><div id="${id}_b" class="bar h-full bg-gradient-to-r from-red-500 to-orange-400 rounded-full"></div></div>`;
const f=(id,l)=>`<label class="lb">${l}</label><input type="file" accept="image/*" onchange="up(this,'${id}')" class="in"><img id="${id}_i" class="hidden rounded-xl mb-3 max-h-40">`;
const M=[
{k:'pic',i:'👤',c:'bg-red-500',t:'Akun PIC',d:'Profil & web PIC',x:t('pic_nama','Nama PIC','Nama lengkap')+f('pic_foto','Upload foto')},
{k:'rak',i:'🗓️',c:'bg-blue-500',t:'Jadwal Kebersihan Rak',d:'Jadwal rutin rak',x:''},
{k:'bean',i:'☕',c:'bg-amber-600',t:'Beanspot',d:'Kebersihan, SO, Exp',x:a('bean_ket','Ket Kebersihan')+t('bean_so','SO')+t('bean_exp','Exp')},
{k:'nsb',i:'📦',c:'bg-orange-500',t:'NSB',d:'Data NSB',x:''},
{k:'saber',i:'🛡️',c:'bg-green-600',t:'SABER',d:'Sapu Bersih',x:''},
{k:'ppsa',i:'📈',c:'bg-purple-600',t:'Target PPSA + Sueger',d:'PSM, PWP, Serba, APC',x:a('ppsa_ket','Ket PPSA (PSM, PWP, SERBA, APC)')+t('ppsa_sueger','SUEGER')+r('ppsa_rg','Progress target')},
{k:'ikt',i:'🎯',c:'bg-red-600',t:'Target IKT',d:'Insentif Kinerja Toko',x:r('ikt_rg','Progress IKT')+f('ikt_foto','Upload foto bukti')},
{k:'kas',i:'💰',c:'bg-emerald-600',t:'Kas Toko',d:'Saldo & setoran',x:n('sa','Saldo Awal','oninput="hk()"')+n('ma','Pemasukan','oninput="hk()"')+n('ke','Pengeluaran','oninput="hk()"')+`<label class="lb">Saldo Akhir (otomatis)</label><input id="ak" data-s readonly class="in bg-slate-100 font-bold">`+f('kas_foto','Upload foto')+`<label class="flex items-center gap-2 mb-3 text-sm font-medium"><input id="setor" data-s type="checkbox" class="w-5 h-5 accent-emerald-600"> Sudah Setor</label>`}
];

// Grid menu
$('grid').innerHTML=M.map((m,i)=>`<div class="card p-4 flex flex-col items-center text-center gap-2" style="animation-delay:${i*.08}s" onclick="openM('${m.k}')"><div class="${m.c} w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shadow-md">${m.i}</div><div class="font-bold text-sm leading-tight">${m.t}</div><div class="text-[11px] text-slate-500">${m.d}</div></div>`).join('');

// Jam live WIB
const tick=()=>$('clock').textContent=new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})+' WIB';
tick();setInterval(tick,1000);

function openM(k){
  const m=M.find(x=>x.k===k);
  $('mi').className=`w-11 h-11 rounded-2xl flex items-center justify-center text-xl ${m.c}`;$('mi').textContent=m.i;$('mt').textContent=m.t;
  $('mb').innerHTML=m.x+`<label class="lb">Link Web</label><input id="link_${k}" type="text" class="border-2 border-dashed border-red-200 bg-yellow-50 rounded-xl p-3 w-full text-sm mb-3" placeholder="${k==='pic'?'https:// web lu nanti':'Tempel link web lu disini nanti...'}">
  <button class="btn w-full bg-[#ED1C24] text-white font-bold py-3 rounded-xl shadow-md" onclick="saveL('${k}')">Simpan &amp; Preview</button>
  <div id="prev_${k}" class="hidden mt-4"><a id="a_${k}" target="_blank" rel="noopener" class="text-sm font-semibold text-blue-600 underline">Buka di tab baru</a><iframe id="if_${k}" class="fi w-full h-[420px] rounded-xl border mt-2"></iframe></div>`;
  document.querySelectorAll('#mb [data-s]').forEach(e=>{
    const v=S.getItem('d_'+e.id);if(v===null)return;
    e.type==='checkbox'?e.checked=v==='1':e.value=v;
  });
  ['pic_foto','ikt_foto','kas_foto'].forEach(id=>{const v=S.getItem('d_'+id);if($(id+'_i')&&v){$(id+'_i').src=v;$(id+'_i').classList.remove('hidden')}});
  document.querySelectorAll('#mb input[type=range]').forEach(e=>rg(e.id,1));
  if($('ak'))hk();
  const l=S.getItem('link_'+k);if(l){$('link_'+k).value=l;showP(k,l)}
  $('ov').classList.remove('hidden');$('ov').classList.add('flex');
}
function closeM(){$('ov').classList.add('hidden');$('ov').classList.remove('flex');$('mb').innerHTML='';head()}
function showP(k,v){$('prev_'+k).classList.remove('hidden');$('prev_'+k).classList.add('block');$('if_'+k).src=v;$('a_'+k).href=v}
function saveL(k){
  const v=$('link_'+k).value.trim();S.setItem('link_'+k,v);
  if(v)showP(k,v);else{$('prev_'+k).classList.add('hidden');$('prev_'+k).classList.remove('block')}
}
function hk(){$('ak').value=(+$('sa').value||0)+(+$('ma').value||0)-(+$('ke').value||0);S.setItem('d_ak',$('ak').value)}
function rg(id,anim){
  const v=$(id).value,b=$(id+'_b');$(id+'_v').textContent=v+'%';b.style.setProperty('--w',v+'%');
  b.style.animation=anim?'':'none';
}
function up(el,id){
  const fr=new FileReader();
  fr.onload=()=>{try{S.setItem('d_'+id,fr.result)}catch(e){alert('Foto terlalu besar untuk disimpan')}
    $(id+'_i').src=fr.result;$(id+'_i').classList.remove('hidden')};
  if(el.files[0])fr.readAsDataURL(el.files[0]);
}
function head(){
  $('hn').textContent=S.getItem('d_pic_nama')||'Belum diisi';
  const p=S.getItem('d_pic_foto');
  $('av').style.backgroundImage=p?`url(${p})`:'';$('av').textContent=p?'':'👤';
}
$('mb').addEventListener('input',e=>{
  const el=e.target;if(!el.hasAttribute('data-s'))return;
  S.setItem('d_'+el.id,el.type==='checkbox'?(el.checked?'1':'0'):el.value);
});
// Ripple untuk semua tombol
document.addEventListener('click',e=>{
  const b=e.target.closest('.btn');if(!b)return;
  const r=b.getBoundingClientRect(),s=document.createElement('span'),z=Math.max(r.width,r.height);
  s.className='rip';s.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;
  b.appendChild(s);setTimeout(()=>s.remove(),600);
});
head();
</script>
</body>
</html>
